name: Build Friendly Discord for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'main.js'
      - 'package.json'
      - '.github/workflows/build-windows-app.yml'
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run dist
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Friendly-Discord-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
